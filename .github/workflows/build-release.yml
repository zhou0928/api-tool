name: build-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:        # 手动触发（如给已有 release 补 Windows 包）
    inputs:
      tag:
        description: '目标 Release tag（默认 v1.0.0）'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write           # GITHUB_TOKEN 需要写 Release；仓库默认 read，这里显式提升

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: cd desktop && npm ci

      - name: 构建 macOS
        if: runner.os == 'macOS'
        run: |
          cd desktop
          npx tauri build
          ./make-dmg.sh
          ./make-zip.sh

      - name: 构建 Windows（NSIS 安装器）
        if: runner.os == 'Windows'
        run: |
          cd desktop
          npx tauri build --bundles nsis

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.zip
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          overwrite_files: true
